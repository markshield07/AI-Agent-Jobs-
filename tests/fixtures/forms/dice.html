<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Senior Network Engineer - Acme Networks - Dice.com</title>
<!--
  A Dice posting (dice.com/job-detail/<guid>) and the Easy Apply wizard it opens, as the Dice
  bots consulted describe them (DiceAutoApply, auto-apply-dice-jobs, September 2026). Without
  ?flow=1 this is the posting: a search form in the header and the
  data-testid="apply-button" control reading "Easy Apply". With ?flow=1 it is the wizard
  (dice.com/job-applications/<guid>/wizard): steps drawn one at a time inside a plain <form> (no <main>, no
  data-testid, as a probe of the live wizard found on the PC, 2026-10-01), moved
  with "Next" and finished with "Submit", then the data-testid="job-application-success-card"
  reading "Application submitted". Step 1, "Resume & Cover Letter", is drawn as the live
  wizard showed it on Mark's PC (2026-10-01): the profile's resume card with only a
  three-dot menu (Download, Delete, Replace), the cover letter's dashed "Upload your cover
  letter" box (left empty), a cookie banner (Reject all / Accept all) over the bottom of the
  page, Next.js's route announcer (role=alert), and Next spinning for a while before the
  following step shows.

  Variants, chosen with ?variant=...:
    needs_input  adds a required years-of-BGP question nothing on file answers
    signed_out   a Login/Register link to dice.com/dashboard/login in the header
    external     "Apply Now" linking to the company's site instead of Easy Apply
    applied      a disabled "Applied" button: applied before
    replace_button  the card shows a plain Replace button, as the Dice bots described it
    replace_box  that Replace button draws a file box instead of opening the file chooser
    invalid      the questions step rejects its answers with an error
    covered      after Replace, a see-through layer over the wizard takes every click
    cookie_frame the cookie banner is drawn in a frame, a moment after the wizard opens

  After the resume is replaced, the first Next draws step 1 again as the PC saw it on its
  second dry run (2026-10-01): the card names the new file, "Uploaded to application on
  10/1/2026", its menu has no Replace, and the button reads "Update". Update goes on.
-->
<style>
  body { font-family: Helvetica, Arial, sans-serif; margin: 0; color: #222; }
  header { display: flex; gap: 8px; padding: 8px 24px; border-bottom: 1px solid #ddd; }
  #posting, #wizard { padding: 16px 24px; max-width: 640px; }
  [data-testid="apply-button"] { background: #0c2577; color: #fff; border: 0; padding: 10px 16px; }
  .q { margin: 10px 0; }
  .q label, .q legend { display: block; font-weight: 600; }
  [data-testid$="error"] { color: #b00020; }
  #cookies { position: fixed; left: 0; right: 0; bottom: 0; height: 60vh; background: #eee;
    border-top: 1px solid #999; padding: 16px; z-index: 10; }
  #__next-route-announcer__ { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; }
  .dashed { border: 1px dashed #888; padding: 12px; }
  [role="menu"] { border: 1px solid #ccc; display: inline-block; }
</style>
</head>
<body>
<header>
  <form id="search" role="search">
    <input name="q" type="text" aria-label="Job title, skill, company, keyword" placeholder="Job title">
    <input name="location" type="text" aria-label="Location" placeholder="Location">
    <button type="submit">Search</button>
  </form>
  <span data-variant="signed_out"><a href="https://www.dice.com/dashboard/login">Login/Register</a></span>
</header>

<div id="posting">
  <h1 data-testid="job-detail-header">Senior Network Engineer</h1>
  <div>Acme Networks · Remote · Full-time</div>
  <div data-variant=",needs_input,signed_out,replace_button,replace_box,invalid,cookie_frame,covered">
    <button data-testid="apply-button" id="easy">Easy Apply</button>
  </div>
  <div data-variant="external">
    <a data-testid="apply-button" id="external" href="https://careers.acme.example/apply/77">Apply Now</a>
  </div>
  <div data-variant="applied">
    <button data-testid="apply-button" disabled>Applied</button>
  </div>
  <p>Run the BGP and data center fabric for a growing network.</p>
</div>

<div id="wizard" hidden><div><div><form id="steps"></form></div></div></div>

<div id="cookies" data-variant=",needs_input,signed_out,external,applied,replace_button,replace_box,invalid">
  <p>We use cookies to improve your experience.</p>
  <button type="button" id="reject-all">Reject all</button>
  <button type="button" id="accept-all">Accept all</button>
</div>

<template id="step-resume">
  <h2>Resume &amp; Cover Letter</h2>
  <p id="__next-route-announcer__" role="alert" aria-live="assertive">Apply to Senior Network Engineer</p>
  <h3>Resume *</h3>
  <div class="resume-card">
    <span id="resume-name">Mark+Shield+CCNP.docx</span>
    <span id="resume-when">Uploaded 8/31/2026</span>
    <button type="button" id="replace" data-only="replace_button,replace_box">Replace</button>
    <button type="button" id="kebab" aria-haspopup="menu" data-not="replace_button,replace_box">
      <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="3" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="8" cy="13" r="1.5"/></svg>
    </button>
    <div role="menu" id="card-menu" hidden>
      <div role="menuitem" id="m-download">Download</div>
      <div role="menuitem" id="m-delete">Delete</div>
      <div role="menuitem" id="m-replace" data-replace>Replace</div>
    </div>
  </div>
  <h3>Cover Letter</h3>
  <label class="dashed">Upload your cover letter
    <input type="file" id="cover-file" accept=".pdf,.doc,.docx" style="display:none">
  </label>
  <button type="button" data-next="resume">Next</button>
</template>

<template id="step-questions">
  <h2>Questions from the employer</h2>
  <fieldset class="q">
    <legend>Are you authorized to work in the United States?</legend>
    <input type="radio" id="auth-yes" name="auth" value="Yes" required><label for="auth-yes">Yes</label>
    <input type="radio" id="auth-no" name="auth" value="No" required><label for="auth-no">No</label>
  </fieldset>
  <div class="q">
    <label for="sponsor">Will you now or in the future require visa sponsorship?</label>
    <select id="sponsor" required>
      <option value="">Select</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>
  </div>
  <div class="q" data-only="needs_input">
    <label for="bgp">How many years of BGP experience do you have?</label>
    <input id="bgp" type="text" required>
  </div>
  <div data-testid="questions-error" id="q-error" hidden></div>
  <button type="button" data-next="review">Next</button>
</template>

<template id="step-review">
  <h2>Review your application</h2>
  <p>Resume: <span id="review-resume"></span></p>
  <button type="button" id="submit">Submit</button>
</template>

<template id="step-sent">
  <div data-testid="job-application-success-card">
    <h2>Application submitted</h2>
    <p>We sent your application to Acme Networks.</p>
  </div>
</template>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var variant = params.get('variant') || '';
  var flow = params.get('flow') === '1';
  Array.prototype.forEach.call(document.querySelectorAll('[data-variant]'), function (el) {
    var wanted = el.getAttribute('data-variant').split(',');
    if (wanted.indexOf(variant) < 0) el.parentNode.removeChild(el);
  });

  function record(key, value) { window[key] = value; }
  function push(name) { record('__steps', (window.__steps || []).concat([name])); }
  var banner = document.getElementById('cookies');
  if (banner) {
    document.getElementById('reject-all').addEventListener('click', function () {
      record('__cookies', 'rejected'); banner.remove();
    });
    document.getElementById('accept-all').addEventListener('click', function () {
      record('__cookies', 'accepted'); banner.remove();
    });
  }
  window.addEventListener('message', function (e) {
    if (e.data !== 'rejected' && e.data !== 'accepted') return;
    record('__cookies', e.data);
    var frame = document.getElementById('cookie-frame');
    if (frame) frame.remove();
  });

  var easy = document.getElementById('easy');
  if (easy) easy.addEventListener('click', function () {
    location.href = location.href.split('?')[0] + '?variant=' + variant + '&flow=1';
  });
  var ext = document.getElementById('external');
  if (ext) ext.addEventListener('click', function (e) { e.preventDefault(); record('__left', true); });

  if (!flow) return;
  document.getElementById('posting').hidden = true;
  document.getElementById('wizard').hidden = false;
  var box = document.getElementById('steps');
  record('__steps', []);
  var resume = 'Mark_Shield_2025.pdf';
  var replaced = false;
  if (variant === 'cookie_frame') setTimeout(function () {
    var f = document.createElement('iframe');
    f.id = 'cookie-frame';
    f.style.cssText = 'position:fixed;left:0;right:0;bottom:0;width:100%;height:60vh;border:0;z-index:10';
    f.srcdoc = '<p>We use cookies.</p>' +
      '<button onclick="parent.postMessage(\'rejected\', \'*\')">Reject all</button>' +
      '<button onclick="parent.postMessage(\'accepted\', \'*\')">Accept all</button>';
    document.body.appendChild(f);
  }, 800);

  function value(id) { var el = document.getElementById(id); return el ? el.value : ''; }

  function takeFile(input) {
    input.addEventListener('change', function () {
      if (!input.files.length) return;
      resume = input.files[0].name;
      replaced = true;
      document.getElementById('resume-name').textContent = resume;
      record('__resume', resume);
      input.parentNode.removeChild(input);
    });
  }

  function show(name) {
    push(name);
    box.innerHTML = document.getElementById('step-' + name).innerHTML;
    Array.prototype.forEach.call(box.querySelectorAll('[data-only]'), function (el) {
      if (el.getAttribute('data-only').split(',').indexOf(variant) < 0) el.parentNode.removeChild(el);
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-not]'), function (el) {
      if (el.getAttribute('data-not').split(',').indexOf(variant) >= 0) el.parentNode.removeChild(el);
    });
    if (name === 'resume' && replaced) {
      // Step 1 again, after Replace: the new file, no Replace, and "Update".
      box.querySelector('#resume-name').textContent = resume;
      box.querySelector('#resume-when').textContent = 'Uploaded to application on 10/1/2026';
      Array.prototype.forEach.call(box.querySelectorAll('[data-replace], #replace'), function (el) {
        el.parentNode.removeChild(el);
      });
      if (variant === 'covered') {
        var layer = document.createElement('div');
        layer.style.cssText = 'position:fixed;inset:0;z-index:50';
        document.body.appendChild(layer);
      }
      var update = box.querySelector('[data-next]');
      update.textContent = 'Update';
      update.setAttribute('data-next', 'questions');
    }
    var cover = box.querySelector('#cover-file');
    if (cover) cover.addEventListener('change', function () { record('__cover', cover.files[0].name); });
    var kebab = box.querySelector('#kebab');
    if (kebab) kebab.addEventListener('click', function () {
      document.getElementById('card-menu').hidden = false;
    });
    var del = box.querySelector('#m-delete');
    if (del) del.addEventListener('click', function () { record('__deleted', true); });
    var mrep = box.querySelector('#m-replace');
    if (mrep) mrep.addEventListener('click', function () {
      document.getElementById('card-menu').hidden = true;
      var input = document.createElement('input');
      input.type = 'file';
      input.style.display = 'none';
      takeFile(input);
      document.body.appendChild(input);
      input.click();
    });
    var replace = box.querySelector('#replace');
    if (replace) replace.addEventListener('click', function () {
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = '.pdf,.doc,.docx';
      takeFile(input);
      if (variant === 'replace_box') {
        input.setAttribute('aria-label', 'Upload resume');
        replace.parentNode.appendChild(input);
      } else {
        input.style.display = 'none';
        document.body.appendChild(input);
        input.click();
      }
    });
    var rv = box.querySelector('#review-resume');
    if (rv) rv.textContent = resume;
    var next = box.querySelector('[data-next]');
    if (next) next.addEventListener('click', function () {
      // Dice spins on Next for a while before the following step shows.
      next.innerHTML = '<span class="spinner" role="progressbar" aria-label="Loading">...</span>';
      setTimeout(function () { advance(name, next.getAttribute('data-next')); }, 2500);
    });
    var submit = box.querySelector('#submit');
    if (submit) submit.addEventListener('click', function () { record('__submitted', true); show('sent'); });
  }

  function advance(from, to) {
    if (from === 'resume' && to === 'resume' && !replaced) to = 'questions';
    if (from === 'questions') {
      var checked = document.querySelector('input[name="auth"]:checked');
      record('__questions', { auth: checked ? checked.value : null, sponsor: value('sponsor'),
        bgp: value('bgp') });
      if (variant === 'invalid') {
        var err = document.getElementById('q-error');
        err.textContent = 'Please answer this question';
        err.hidden = false;
        return;
      }
      if (variant === 'needs_input' && !value('bgp')) return;
    }
    show(to);
  }

  show('resume');
})();
</script>
</body>
</html>
