<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IT Infrastructure Network Engineer | Stand8 Technology Consulting | LinkedIn</title>
<!--
  LinkedIn's posting and Easy Apply window as drawn in September 2026, after the Mac's
  capture of Stand8's (capture-linkedin-easyapply-d3cb1545d6f8c2e7.html): class names are
  obfuscated, the window is a native <dialog data-testid="dialog" aria-labelledby=
  "dialog-header"> with no role="dialog" or artdeco classes, its buttons carry only their
  text ("Next", "Review", "Submit application") and a componentkey, and each field sits in
  a div[componentkey^="easyApplyFieldFocus_ea.q::"] with a <label for>. Dismiss opens a
  second dialog, "Save this application?", with Discard and Save. The page around it has
  a search box and a "Set alert for similar jobs" switch, which are not the application.

  Pages: contact info (name and phone prefilled from the profile, an email list, a city
  typeahead), resume (nothing saved on LinkedIn: an empty radio group and an "Upload
  resume" button whose file box only exists once it is pressed), questions, review. Variants with ?variant=...:
    needs_input  a question nobody on file answers
    external     no Easy Apply: "Apply on company website" through /safety/go/
    urnreview    Review shows the city as LinkedIn's id, urn:li:geo:103033862
    urnprefill   the city box opens already holding LinkedIn's id, urn:li:geo:103033862,
                 as it does when an earlier application left that id saved (Robert Half,
                 2026-10-01)
    nolist       typing in the city box brings up no list of places; the typed text stays
                 in the box and LinkedIn keeps the saved place, urn:li:geo:103033862,
                 underneath, which Review shows
    radios       Luxoft's two Yes/No questions as the Mac captured them on 2026-09-28
                 (capture-linkedin-radios-luxoft.html): the question is a <p> before a
                 <fieldset role="radiogroup">, each choice a <div role="radio"> whose
                 aria-label is the question, holding a named radio with an empty
                 <label for> and the option's text in a <p> beside it
    commute      Insight Global's "Are you comfortable commuting to this job's location? *"
    unstarred    a Yes/No question with no star that the form will not leave empty
    savedresume  a resume kept on LinkedIn from before, a choice labelled only by its file
                 name (capture-linkedin-resume-radio.html), already selected
-->
<style>
  body { font-family: sans-serif; margin: 0; }
  .m1 { max-width: 760px; margin: 0 auto; padding: 16px; }
  dialog { width: 560px; }
  .m9 { display: block; margin-top: 8px; }
  .hits { border: 1px solid #ccc; }
  .hits div { padding: 4px; cursor: pointer; }
</style>
</head>
<body>
<header class="m2"><input class="m3" id="search" placeholder="Search" aria-label="Search"></header>
<main class="m1" id="main"></main>
<script>
(function () {
  var variant = new URLSearchParams(location.search).get('variant') || '';
  window.__steps = [];
  var main = document.getElementById('main');
  var apply = variant === 'external'
    ? '<a class="m4" aria-label="Apply on company website" href="https://www.linkedin.com/safety/go/?url=https%3A%2F%2Fcareers.stand8.com%2Fjobs%2F42&trk=x">Apply</a>'
    : '<button class="m4" type="button" aria-label="Easy Apply to this job"><span>Easy Apply</span></button>';
  main.innerHTML = '<h1>IT Infrastructure Network Engineer (CCNP or CCIE)</h1>' +
    '<p>Stand8 Technology Consulting · Los Angeles, CA (Remote)</p>' + apply +
    '<div class="m5"><label class="m6"><input type="checkbox" role="switch" id="alert"> Set alert for similar jobs</label></div>' +
    '<p>We are looking for a network engineer.</p>';
  if (variant === 'external') return;

  var field = function (id, kind, label, attrs, inner) {
    var key = 'easyApplyFieldFocus_ea.q::3654284' + id.replace(/\D/g, '') + '::' + kind + '::value.validation';
    return '<div componentkey="' + key + '"><label for="' + id + '"><div>' + label + '</div></label><div>' + inner(attrs) + '</div></div>';
  };
  var text = function (id, kind, label, value, required) {
    return field(id, kind, label, '', function () {
      return '<input ' + (required ? 'required="" ' : '') + 'id="' + id + '" dir="auto" type="text" value="' + value + '">';
    });
  };
  // LinkedIn's Yes/No question, as captured from Luxoft's.
  var radios = function (gid, question, star) {
    var opt = function (id, text) {
      return '<div role="radio" tabindex="0" aria-label="' + question + ' " aria-checked="false"><div><div>' +
        '<input id="' + id + '" type="radio" name="radio-group-' + gid + '"><label for="' + id + '"></label></div>' +
        '<div><p>' + text + '</p></div></div></div>';
    };
    return '<div componentkey="easyApplyFieldFocus_ea_validation_p2_0_' + gid.replace(/\W/g, '') + '"><p>' + question + (star ? ' *' : '') + '</p>' +
      '<fieldset aria-describedby="error-message-' + gid + '" role="radiogroup" data-q="' + gid + '"><div>' +
      opt(gid + 'y', 'Yes') + opt(gid + 'n', 'No') + '</div></fieldset><p id="error-message-' + gid + '"></p></div>';
  };
  var chosenIn = function (fs) {
    var on = fs.querySelector('input:checked');
    return on ? on.closest('[role="radio"]').innerText.trim() : null;
  };
  var button = function (label) {
    return '<button type="button" componentkey="k-' + label.replace(/\W/g, '') + '"><span><span>' + label + '</span></span></button>';
  };
  var pages = [
    { name: 'contact', title: 'Contact info', body: function () {
      return text('_r_9_', 'FIRST_NAME', 'First name*', 'Mark', true) +
        text('_r_a_', 'UNKNOWN', 'Middle name', '', false) +
        text('_r_b_', 'LAST_NAME', 'Last name*', 'Shield', true) +
        '<div><div><label for="_r_c_"><div>Phone country code</div></label><div><select id="_r_c_">' +
        '<option value="" disabled hidden></option><option value="ca">Canada (+1)</option>' +
        '<option value="us" selected>United States (+1)</option></select></div></div>' +
        field('_r_e_', 'PHONE_MOBILE', 'Mobile phone number', '', function () {
          return '<input id="_r_e_" dir="auto" type="tel" value="3105550100">';
        }) + '</div>' +
        '<div><label for="_r_f_"><div>Email address*</div></label><div><select id="_r_f_" required>' +
        '<option value="">Select an option</option><option selected>mark@example.com</option></select></div></div>' +
        '<div componentkey="easyApplyFieldFocus_ea.q::36542843762::UNKNOWN::value.validation"><p>Location (city)</p>' +
        '<div data-expanded="false"><div><input id="_r_k_" data-testid="typeahead-input" autocomplete="off" dir="auto"' +
        ' placeholder="Enter city or location" aria-autocomplete="list" value="' +
        (variant === 'urnprefill' ? 'urn:li:geo:103033862' : '') + '"></div><div class="hits" id="hits"></div></div></div>';
    } },
    { name: 'resume', title: 'Resume', body: function () {
      // As on Stand8's: no resume saved on LinkedIn, an empty radio group, and
      // an "Upload resume" button with no file box in the window until pressed.
      return '<div><div><p>Resume*</p><p>Select or upload a resume in DOC, DOCX, or PDF format that is less than 2MB</p></div>' +
        '<div><fieldset aria-describedby="error-message-_r_11_" role="radiogroup"><div><div id="easyApplyUploadedResumeRef"' +
        ' componentkey="easyApplyUploadedResumeRef">' + (window.__resume ? chosen(window.__resume) : '') + '</div>' +
        (variant === 'savedresume' ? kept_resume() : '') + '</div></fieldset>' +
        '<div><button type="button" componentkey="up-1"><span><span>Upload resume</span></span></button></div>' +
        '<p id="resume-error"></p></div></div>';
    } },
    { name: 'questions', title: 'Additional questions', body: function () {
      return field('_r_q_', 'UNKNOWN', 'Are you legally authorized to work in the United States?*', '', function () {
          return '<select id="_r_q_" required><option value="">Select an option</option><option>Yes</option><option>No</option></select>';
        }) +
        field('_r_s_', 'UNKNOWN', 'Will you now or in the future require sponsorship for employment visa status?*', '', function () {
          return '<select id="_r_s_" required><option value="">Select an option</option><option>Yes</option><option>No</option></select>';
        }) +
        (variant === 'needs_input'
          ? text('_r_t_', 'NUMERIC', 'How many years of work experience do you have with Juniper Mist?*', '', true)
          : '') +
        (variant === 'radios'
          ? radios('_r_j_', 'Do you have CISCO &amp; Load Balancing (F5) listed in your resume?', true) +
            radios('_r_m_', 'Do you have Team Lead or Technical Lead experience listed in your resume?', true)
          : '') +
        (variant === 'commute' ? radios('_r_c1_', 'Are you comfortable commuting to this job\'s location?', true) : '') +
        (variant === 'unstarred' ? radios('_r_u_', 'Do you have a valid driver\'s license?', false) : '');
    } },
    { name: 'review', title: 'Review your application', body: function () {
      var city = (kept.contact && kept.contact.city) || '';
      if (variant === 'urnreview' || (variant === 'nolist' && !window.__picked)) city = 'urn:li:geo:103033862';
      return '<p>Check your answers before you send them.</p><p>Location (city)</p><p>' + city + '</p>';
    } },
  ];
  var SAVED = 'd8763d2995d3d0ac-87.pdf';
  var kept_resume = function () {
    var on = !window.__resume;
    return '<div><div role="button" tabindex="0"><div><p>PDF</p></div><div><p><span>' + SAVED + '</span></p><p>9/28/2026</p></div></div>' +
      '<div role="radio" tabindex="0" aria-label="' + SAVED + '" aria-checked="' + on + '"><div aria-label="' + SAVED + '">' +
      '<input id="_r_e_" type="radio"' + (on ? ' checked' : '') + ' name="radio-group-_r_d_"><label for="_r_e_"></label></div></div></div>';
  };
  var chosen = function (name) {
    return '<label><input type="radio" name="resume" checked> ' + name + '</label>';
  };
  var at = 0;
  var dialog = null;
  var kept = {};
  var val = function (id) { var el = document.getElementById(id); return el ? el.value : null; };
  var draw = function () {
    var p = pages[at];
    window.__steps.push(p.name);
    var foot = at === pages.length - 1 ? button('Submit application') : button(at === pages.length - 2 ? 'Review' : 'Next');
    dialog.innerHTML = '<button type="button" aria-label="Dismiss"><span>×</span></button><div><header id="dialog-header">' +
      '<h2>Apply to Stand8 Technology Consulting</h2></header><div data-testid="dialog-content">' +
      '<div data-sdui-screen="com.linkedin.sdui.flagshipnav.jobs.easyapply.EasyApply"><div class="m7">' +
      '<p>' + (at + 1) + '/' + pages.length + ' pages</p><div class="m8"><p>' + p.title + '</p>' + p.body() + '</div>' +
      '<div><hr role="presentation"><footer>' + (at ? button('Back') : '') + foot + '</footer></div></div></div></div></div>';
    dialog.querySelector('[aria-label="Dismiss"]').addEventListener('click', dismiss);
    var loc = document.getElementById('_r_k_');
    if (loc) loc.addEventListener('input', function () {
      var hits = document.getElementById('hits');
      hits.innerHTML = loc.value.length < 3 || variant === 'nolist' ? '' : '<div role="listbox"><div role="option">Menifee, California, United States</div></div>';
      var opt = hits.querySelector('[role="option"]');
      // Like the live one on 2026-09-28: a click the page did not see as a real
      // one leaves the place's id in the box ("urn:li:geo:..."), shown on Review.
      if (opt) opt.addEventListener('click', function (e) {
        loc.value = e.isTrusted ? opt.textContent : 'urn:li:geo:103033862';
        window.__picked = e.isTrusted;
        hits.innerHTML = '';
      });
    });
    if (loc) loc.addEventListener('keydown', function (e) {
      var opt = document.querySelector('#hits [role="option"]');
      if (e.key === 'ArrowDown' && opt) opt.setAttribute('aria-selected', 'true');
      if (e.key === 'Enter' && opt && opt.getAttribute('aria-selected') === 'true') {
        loc.value = opt.textContent;
        document.getElementById('hits').innerHTML = '';
      }
    });
    Array.from(dialog.querySelectorAll('button')).filter(function (b) { return b.textContent.trim() === 'Upload resume'; })
      .forEach(function (b) {
        b.addEventListener('click', function () {
          var box = document.createElement('input');
          box.type = 'file';
          box.accept = '.pdf,.doc,.docx';
          box.style.display = 'none';
          document.body.appendChild(box);
          box.addEventListener('change', function () {
            var name = box.files[0] && box.files[0].name;
            setTimeout(function () {  // the upload takes a moment to show
              window.__resume = name;
              var ref = document.getElementById('easyApplyUploadedResumeRef');
              if (ref) ref.innerHTML = chosen(name);
              var old = document.getElementById('_r_e_');
              if (old) { old.checked = false; old.closest('[role="radio"]').setAttribute('aria-checked', 'false'); }
            }, 600);
          });
          box.click();
        });
      });
    // Like LinkedIn's: pressing the drawn choice selects the input inside it.
    Array.from(dialog.querySelectorAll('[role="radio"]')).forEach(function (r) {
      r.addEventListener('click', function () {
        var box = r.querySelector('input');
        if (box) box.checked = true;
        sync(r.closest('fieldset'));
      });
    });
    Array.from(dialog.querySelectorAll('fieldset input[type="radio"]')).forEach(function (box) {
      box.addEventListener('change', function () { sync(box.closest('fieldset')); });
    });
    Array.from(dialog.querySelectorAll('footer button')).forEach(function (b) {
      b.addEventListener('click', function () { step(b.textContent.trim()); });
    });
  };
  var sync = function (fs) {
    if (!fs) return;
    fs.querySelectorAll('[role="radio"]').forEach(function (r) {
      var box = r.querySelector('input');
      r.setAttribute('aria-checked', box && box.checked ? 'true' : 'false');
    });
  };
  var step = function (label) {
    if (label === 'Back') { at -= 1; draw(); return; }
    if (label === 'Submit application') {
      window.__submitted = { contact: kept.contact, questions: kept.questions, resume: kept.resume };
      dialog.innerHTML = '<div data-testid="dialog-content"><h2>Your application was sent to Stand8 Technology Consulting</h2>' +
        '<button type="button">Done</button></div>';
      return;
    }
    var missing = Array.from(dialog.querySelectorAll('[required]')).filter(function (el) { return !el.value; });
    if (missing.length) return;  // a required box left empty: the step stays
    // Every Yes/No question must be answered, starred or not.
    var blank = Array.from(dialog.querySelectorAll('fieldset[data-q]')).filter(function (fs) { return !chosenIn(fs); });
    blank.forEach(function (fs) { document.getElementById('error-message-' + fs.getAttribute('data-q')).textContent = 'This field is required'; });
    if (blank.length) return;
    var saved = document.getElementById('_r_e_');
    if (pages[at].name === 'resume' && !window.__resume && !(saved && saved.checked)) {
      document.getElementById('resume-error').textContent = 'A resume is required';
      return;
    }
    if (pages[at].name === 'contact') kept.contact = { first: val('_r_9_'), last: val('_r_b_'), phone: val('_r_e_'), email: val('_r_f_'), city: val('_r_k_') };
    if (pages[at].name === 'resume') kept.resume = window.__resume || SAVED;
    if (pages[at].name === 'questions') {
      kept.questions = { auth: val('_r_q_'), sponsor: val('_r_s_'), mist: val('_r_t_') };
      Array.from(dialog.querySelectorAll('fieldset[data-q]')).forEach(function (fs) { kept.questions[fs.getAttribute('data-q')] = chosenIn(fs); });
    }
    at += 1;
    draw();
  };
  var dismiss = function () {
    var ask = document.createElement('dialog');
    ask.setAttribute('data-testid', 'dialog');
    ask.setAttribute('open', '');
    ask.innerHTML = '<button type="button" aria-label="Dismiss"><span>×</span></button><div><div data-testid="dialog-content">' +
      '<div><h2>Save this application?</h2><p>Save to return to this application later.</p><div>' +
      button('Discard') + button('Save') + '</div></div></div></div>';
    document.body.appendChild(ask);
    ask.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        var t = b.textContent.trim();
        if (t === 'Discard') window.__discarded = true;
        if (t === 'Save') window.__saved = true;
        ask.remove();
        if (t !== 'Save') { dialog.remove(); }
      });
    });
  };
  document.querySelector('[aria-label="Easy Apply to this job"]').addEventListener('click', function () {
    dialog = document.createElement('dialog');
    dialog.className = 'm6fmt9 m6fmt8';
    dialog.setAttribute('data-testid', 'dialog');
    dialog.setAttribute('aria-labelledby', 'dialog-header');
    dialog.setAttribute('open', '');
    document.body.appendChild(dialog);
    draw();
  });
})();
</script>
</body>
</html>
