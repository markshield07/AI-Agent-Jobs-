[project]
name = "jobagent"
version = "0.1.0"
description = "An agent that finds jobs, tailors a resume per posting from a verified fact base, applies, and reports on a dashboard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-jobspy>=1.1.80",
    "jinja2>=3.1",
    "weasyprint>=60",
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
jobagent = "jobagent.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobagent = ["db/*.sql", "tailor/templates/*.html", "apply/browser/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
