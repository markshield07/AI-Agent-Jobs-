<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Network Engineering Manager | Acme Robotics Careers</title>
<!--
  A posting on a company's Workday site (<company>.wd5.myworkdayjobs.com/...), drawn with the
  data-automation-id values Workday uses: the job search box and Sign In in the header, the
  "Apply" adventureButton, the start choice (autofillWithResume, applyManually), and the steps
  in <main data-automation-id="applyFlowPage">: Autofill with Resume, My Information, My
  Experience, Application Questions, Voluntary Disclosures, Self Identify, Review. Each step
  is drawn in a wrapper named for it (applyFlowAutoFillPage, applyFlowMyInfoPage, ...) and
  ends with pageFooterNextButton ("Continue", "Save and Continue", then "Submit" on Review).
  Like the live site, it is one page: after Save and Continue the step just left stays on
  screen for a while before the next is drawn. Its controls are Workday's own: dropdowns are
  <button aria-haspopup="listbox"> opening role=option items; "How Did You Hear About Us?" is
  a prompt, a searchBox whose categories open further lists and whose pick shows as a
  selectedItem pill (itself role=option, in a role=listbox of picked items); the signature
  date is three spin buttons (dateSectionMonth/Day/Year-input). Errors show as errorMessage.

  The Autofill and My Information markup is copied from a live CrowdStrike posting
  (2026-09-27): the resume box with no label but "Select file", ids such as
  name--legalName--firstName, the previous-worker radio marked required only on its group
  and in its legend, and the country phone code prefilled as a pill.

  Variants, chosen with ?variant=...:
    manual       the start choice offers Apply Manually only; My Experience has no resume yet
    signed_out   choosing how to start leads to Workday's sign-in page
    needs_input  Application Questions adds a required question nothing on file answers
    invalid      Application Questions will not save and shows an error
    closed       the posting no longer takes applications and has no Apply button
    unconfirmed  Submit shows nothing afterwards
    greyed       Submit greys out and nothing shows, but the posting, opened again
                 (with the same ?token=), says "You applied for this job on ...".
    draft        an earlier run saved a draft: the posting offers Continue Application, which
                 opens the first unsaved step (My Information) with no start choice
    stuck        Apply Manually leaves the loading page up for good
  Without autofill (manual, draft) My Experience has one empty work entry, as live.
-->
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0; color: #222; }
  header { display: flex; gap: 12px; padding: 8px 24px; border-bottom: 1px solid #ddd; }
  section, main { padding: 16px 24px; }
  [data-automation-id^="formField-"] { margin: 12px 0; position: relative; }
  [data-automation-id^="formField-"] > label, legend { display: block; font-weight: 600; }
  [role="listbox"] { border: 1px solid #999; background: #fff; margin: 0; padding: 0; list-style: none; width: 320px; }
  [role="option"] { padding: 4px 8px; cursor: pointer; }
  [data-automation-id="errorMessage"] { color: #b00020; }
  [data-automation-id="selectedItem"] { display: inline-block; background: #eef; padding: 2px 6px; border-radius: 10px; }
  .file-input { position: absolute; left: -9999px; }
  .date input { width: 48px; }
  /* Live, the "MM" display lies over the month box and takes its clicks. */
  .overlaid { position: relative; display: inline-block; }
  .overlaid [data-automation-id$="-display"] { position: absolute; inset: 0; background: #fff; }
  footer { margin-top: 16px; }
  #start { border: 1px solid #999; padding: 16px; width: 360px; }
</style>
</head>
<body>
<header data-automation-id="header">
  <input data-automation-id="keywordSearchInput" id="job-search" type="text" placeholder="Search for jobs" aria-label="Search for jobs">
  <button data-automation-id="utilityButtonSignIn" type="button">Sign In</button>
</header>

<section id="posting">
  <h2 data-automation-id="jobPostingHeader">Network Engineering Manager</h2>
  <div>Remote, USA</div>
  <div data-variant="closed"><p>This job posting is no longer accepting applications.</p></div>
  <div data-variant=",manual,signed_out,needs_input,invalid,unconfirmed,stuck,greyed">
    <a data-automation-id="adventureButton" role="button" href="#apply">Apply</a>
  </div>
  <div data-variant="draft">
    <a href="#apply" role="button" data-automation-id="continueButton">Continue Application</a>
  </div>
  <p id="applied-note" hidden></p>
  <p>Lead the team that runs our warehouse robot network.</p>
</section>

<div id="start" role="dialog" hidden>
  <h3>Start Your Application</h3>
  <div data-variant=",signed_out,needs_input,invalid,unconfirmed,greyed">
    <a data-automation-id="autofillWithResume" role="button" href="#autofill">Autofill with Resume</a>
  </div>
  <a data-automation-id="applyManually" role="button" href="#manual">Apply Manually</a>
</div>

<main data-automation-id="applyFlowPage" id="flow-page" hidden>
  <ol data-automation-id="progressBar" id="progress"></ol>
  <div id="flow"></div>
</main>

<template id="step-signin">

    <div data-automation-id="formField-password"><label for="si-password">Password</label><input id="si-password" type="password" data-automation-id="password"></div>
    <button type="button" data-automation-id="signInSubmitButton">Sign In</button>
    <a data-automation-id="createAccountLink" href="#create">Create Account</a>
  </div>
</template>

<template id="step-autofill">

  <h2>Autofill with Resume</h2>
  <p>Upload either DOC, DOCX, HTML, PDF, or TXT file types (5MB max)</p>
  <div data-automation-id="formField-">
    <div data-automation-id="resumeUpload">
      <div data-automation-id="file-upload-drop-zone">
        <p>Drop file here</p>
        <button type="button" data-automation-id="select-files" id="input-4">Select file</button>
      </div>
      <input data-automation-id="file-upload-input-ref" class="file-input" type="file" accept=".pdf,.doc,.docx">
    </div>
  </div>
  <footer><button type="button" data-automation-id="pageFooterNextButton">Continue</button></footer>
  </div>
</template>

      </div>
    </div>
  </div>
  <footer><button type="button" data-automation-id="pageFooterNextButton">Save and Continue</button></footer>
  </div>
</template>

    <button type="button" id="q-auth" aria-haspopup="listbox" data-options="Yes|No">Select One</button>

    <button type="button" id="q-sponsor" aria-haspopup="listbox" data-options="Yes|No">Select One</button>

  <div data-automation-id="formField-932ff5fbe6fa1001a49d69becb4e0001" data-fkit-id="primaryQuestionnaire--932ff5fbe6fa1001a49d69becb4e0001">
    <fieldset><legend><div id="label-932ff5fbe6fa1001a49d69becb4e0001"><div data-automation-id="richText"><p><b>Why are you interested in working for Acme Robotics?</b></p></div></div></legend>
    <textarea id="primaryQuestionnaire--932ff5fbe6fa1001a49d69becb4e0001" aria-required="false"></textarea></fieldset>
  </div>
  <div data-automation-id="formField-teams" data-only="needs_input">

        <input id="selfId-date-day" type="text" role="spinbutton" aria-label="Day" data-automation-id="dateSectionDay-input">

  <footer><button type="button" data-automation-id="pageFooterNextButton">Submit</button></footer>

<template id="step-sent">
  <div data-automation-id="congratulationsPopup">
    <h2>Application Submitted</h2>
    <p>Congratulations, your application has been submitted. You can check its status in My Applications.</p>
  </div>
</template>

<script>
(function () {
  var variant = new URLSearchParams(location.search).get('variant') || '';
  var token = new URLSearchParams(location.search).get('token') || '';
  Array.prototype.forEach.call(document.querySelectorAll('[data-variant]'), function (el) {
    var wanted = el.getAttribute('data-variant').split(',');
    if (wanted.indexOf(variant) < 0) el.parentNode.removeChild(el);
  });
  var applied = null;
  try { applied = token && localStorage.getItem('applied:' + token); } catch (e) {}
  if (applied) {
    var note = document.getElementById('applied-note');
    note.textContent = 'You applied for this job on ' + applied + '.';
    note.hidden = false;
  }
  window.__steps = [];
  window.__answers = {};
  window.__uploads = 0;
  var flow = document.getElementById('flow');
  var start = document.getElementById('start');
  var path = 'autofill';
  var order = ['info', 'experience', 'questions', 'disclosures', 'selfid', 'review'];
  var TITLES = { autofill: 'Autofill with Resume', info: 'My Information', experience: 'My Experience',
    questions: 'Application Questions', disclosures: 'Voluntary Disclosures', selfid: 'Self Identify',
    review: 'Review' };
  // How long the step just left stays on screen before the next one is drawn:
  // longer than the handler's settle wait, so a handler that does not wait
  // for the new step reads the old one. As on the live site the progress bar
  // moves to the next step at once, over the old page; then no page at all,
  // then a loading page, then the step.
  var DRAW_MS = Number(new URLSearchParams(location.search).get('draw_ms')) || 500;
  var LOADING_MS = 400;
  var BLANK_MS = 150;
  var drawing = false;

  // The prompt's lists: the first list, and what each category opens.
  var TOP = ['Company Website', 'Job Board', 'Referral'];
  var UNDER = { 'Job Board': ['Glassdoor', 'Indeed', 'LinkedIn'] };
  var CODES = ['Canada (+1)', 'United Kingdom (+44)', 'United States of America (+1)'];

  var apply = document.querySelector('[data-automation-id="adventureButton"]');
  if (apply) apply.addEventListener('click', function (e) { e.preventDefault(); start.hidden = false; });
  var resume = document.querySelector('[data-automation-id="continueButton"]');
  if (resume) resume.addEventListener('click', function (e) {
    e.preventDefault();
    path = 'draft';
    document.getElementById('posting').hidden = true;
    document.getElementById('flow-page').hidden = false;
    later('info');
  });
  Array.prototype.forEach.call(start.querySelectorAll('a'), function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      path = a.getAttribute('data-automation-id') === 'autofillWithResume' ? 'autofill' : 'manual';
      window.__start = path;
      start.hidden = true;
      document.getElementById('posting').hidden = true;
      document.getElementById('flow-page').hidden = false;
      if (variant === 'signed_out') { show('signin'); return; }
      if (variant === 'stuck') { flow.innerHTML = '<div data-automation-id="applyFlowLoadingPage"><p>Loading</p></div>'; return; }
      later(path === 'autofill' ? 'autofill' : 'info');
    });
  });

  function text(el) { return (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim(); }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  function shown(id) { var el = document.getElementById(id); return el ? text(el) : ''; }
  function closeLists() { Array.prototype.forEach.call(document.querySelectorAll('[data-automation-id="activeListContainer"]'), function (l) { l.remove(); }); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLists(); });

  function listUnder(anchor, items, onPick) {
    closeLists();
    var list = document.createElement('ul');
    list.setAttribute('role', 'listbox');
    list.setAttribute('data-automation-id', 'activeListContainer');
    items.forEach(function (item) {
      var li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.setAttribute('data-automation-id', 'promptOption');
      li.textContent = item;
      li.addEventListener('click', function () { onPick(item); });
      list.appendChild(li);
    });
    anchor.insertAdjacentElement('afterend', list);
  }

  function wireDropdowns(root) {
    Array.prototype.forEach.call(root.querySelectorAll('button[aria-haspopup="listbox"]'), function (b) {
      b.addEventListener('click', function () {
        listUnder(b, b.getAttribute('data-options').split('|'), function (item) { b.textContent = item; closeLists(); });
      });
    });
  }

  function wirePrompt(box) {
    var input = box.querySelector('[data-automation-id="searchBox"]');
    var pills = box.querySelector('[data-automation-id="selectedItemList"]');
    var codes = input.id === 'phoneNumber--countryPhoneCode';
    var first = codes ? CODES : TOP;
    var all = codes ? CODES : TOP.concat(UNDER['Job Board']);
    function pick(item) {
      if (!codes && UNDER[item]) { listUnder(input.parentNode, UNDER[item], pick); return; }
      pills.innerHTML = '<li role="presentation"><div data-automation-id="selectedItem" role="option" aria-selected="true"></div></li>';
      pills.querySelector('[data-automation-id="selectedItem"]').textContent = item;
      input.value = '';
      closeLists();
    }
    input.addEventListener('click', function () { listUnder(input.parentNode, first, pick); });
    input.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var q = input.value.toLowerCase();
      listUnder(input.parentNode, all.filter(function (t) { return t.toLowerCase().indexOf(q) >= 0; }), pick);
    });
  }

  function later(name) {
    drawing = true;
    progressOn(name);
    setTimeout(function () {
      flow.innerHTML = '';
      setTimeout(function () {
        flow.innerHTML = '<div data-automation-id="applyFlowLoadingPage"><p>Loading</p></div>';
        setTimeout(function () { drawing = false; show(name); }, LOADING_MS);
      }, BLANK_MS);
    }, DRAW_MS);
  }

  function progressOn(name) {
    var progress = document.getElementById('progress');
    progress.innerHTML = TITLES[name] ? '<li data-automation-id="progressBarActiveStep"></li>' : '';
    if (TITLES[name]) progress.firstChild.textContent = TITLES[name];
  }

  function show(name) {
    window.__steps.push(name);
    flow.innerHTML = document.getElementById('step-' + name).innerHTML;
    Array.prototype.forEach.call(flow.querySelectorAll('[data-only]'), function (el) {
      if (el.getAttribute('data-only') !== variant) el.parentNode.removeChild(el);
    });
    Array.prototype.forEach.call(flow.querySelectorAll('[data-only-autofill]'), function (el) {
      if (path !== 'autofill') el.parentNode.removeChild(el);
    });
    Array.prototype.forEach.call(flow.querySelectorAll('[data-not-autofill]'), function (el) {
      if (path === 'autofill') el.parentNode.removeChild(el);
    });
    Array.prototype.forEach.call(flow.querySelectorAll('input[type="file"]'), function (f) {
      f.addEventListener('change', function () { window.__uploads += f.files.length; });
    });
    wireDropdowns(flow);
    Array.prototype.forEach.call(flow.querySelectorAll('[id$="-dateSectionMonth"], [id$="-dateSectionYear"]'), function (sec) {
      sec.addEventListener('click', function () { var i = sec.querySelector('input'); if (i) i.focus(); });
    });
    Array.prototype.forEach.call(flow.querySelectorAll('[data-automation-id="multiSelectContainer"]'), wirePrompt);
    progressOn(name);
    var next = flow.querySelector('[data-automation-id="pageFooterNextButton"]');
    // Live, a press here lands on the next step before it is filled in.
    if (next) next.addEventListener('click', function () {
      if (drawing) { window.__early = (window.__early || 0) + 1; return; }
      advance(name);
    });
  }

  function error(message) {
    var el = document.createElement('div');
    el.setAttribute('data-automation-id', 'errorMessage');
    el.textContent = message;
    flow.insertBefore(el, flow.firstChild);
  }

  function advance(from) {
    var a = window.__answers;
    if (from === 'autofill') {
      var f = flow.querySelector('[data-automation-id="resumeUpload"] input[type="file"]');
      if (!f.files.length) { error('Error: Upload a file'); return; }
      a.autofillResume = f.files[0].name;
      later('info');
      return;
    }
    if (from === 'info') {
      var pill = flow.querySelector('[data-automation-id="formField-source"] [data-automation-id="selectedItem"]');
      var code = flow.querySelector('[data-automation-id="formField-countryPhoneCode"] [data-automation-id="selectedItem"]');
      var prev = flow.querySelector('input[name="candidateIsPreviousWorker"]:checked');
      a.info = { source: pill ? text(pill) : '', previous: prev ? prev.value : '', country: shown('country--country'),
        first: val('name--legalName--firstName'), last: val('name--legalName--lastName'),
        preferred: document.getElementById('name--preferredCheck').checked,
        street: val('address--addressLine1'), city: val('address--city'), state: shown('address--countryRegion'),
        zip: val('address--postalCode'), phoneType: shown('phoneNumber--phoneType'),
        code: code ? text(code) : '', phone: val('phoneNumber--phoneNumber'), extension: val('phoneNumber--extension') };
      var i = a.info;
      if (!pill || !prev || !i.first || !i.last || !i.street || !i.city || i.state === 'Select One' || !i.zip
          || i.phoneType === 'Select One' || !code || !i.phone) { error('Errors Found: fill in the required fields'); return; }
    }
    if (from === 'experience') {
      var r = flow.querySelector('[data-fkit-id="resumeAttachments--attachments"] input[type="file"]');
      a.experienceResume = r.files.length ? r.files[0].name : null;
      a.jobs = Array.prototype.map.call(flow.querySelectorAll('[data-automation-id="workExperienceSection"]'), function (w) {
        var f = w.getAttribute('data-fkit-id');
        var part = function (p) { var el = document.getElementById(f + '--' + p); return el ? el.value : ''; };
        return { title: part('jobTitle'), company: part('companyName'), location: part('location'),
          description: part('roleDescription'),
          current: document.getElementById(f + '--currentlyWorkHere').checked,
          from: part('startDate-dateSectionMonth-input') + '/' + part('startDate-dateSectionYear-input'),
          to: part('endDate-dateSectionMonth-input') + '/' + part('endDate-dateSectionYear-input') };
      });
      if (!r.files.length) { error('Error: The field Upload a file (5MB max) is required and must have a value.'); return; }
      for (var j = 0; j < a.jobs.length; j++) {
        if (!a.jobs[j].title || !a.jobs[j].company) { error('Errors Found: Job Title and Company are required'); return; }
        if (a.jobs[j].from === '/' || (!a.jobs[j].current && a.jobs[j].to === '/')) { error('Errors Found: From and To are required'); return; }
      }
    }
    if (from === 'questions') {
      a.questions = { auth: shown('q-auth'), sponsor: shown('q-sponsor'), teams: val('q-teams'),
        why: val('primaryQuestionnaire--932ff5fbe6fa1001a49d69becb4e0001') };
      if (variant === 'invalid') { error('Error: The field Sponsorship could not be saved'); return; }
      if (a.questions.auth === 'Select One' || a.questions.sponsor === 'Select One') { error('Errors Found'); return; }
    }
    if (from === 'disclosures') {
      a.disclosures = { gender: shown('d-gender'), veteran: shown('d-veteran'),
        terms: document.getElementById('termsAndConditions--acceptTermsAndAgreements').checked };
    }
    if (from === 'selfid') {
      var dis = Array.prototype.map.call(flow.querySelectorAll('input[name="disabilityStatus"]:checked'), function (c) { return c.value; });
      a.selfid = { name: val('selfId-name'), month: val('selfId-date-month'), day: val('selfId-date-day'),
        year: val('selfId-date-year'), disability: dis };
    }
    if (from === 'review') {
      window.__submitted = true;
      if (variant === 'unconfirmed') { flow.innerHTML = ''; return; }
      if (variant === 'greyed') {
        // Live: Submit greys out and stays so; only the posting later says it went in.
        var submit = flow.querySelector('[data-automation-id="pageFooterNextButton"]');
        if (submit) submit.disabled = true;
        try { localStorage.setItem('applied:' + token, '09/28/2026'); } catch (e) {}
        return;
      }
      show('sent');
      return;
    }
    later(order[order.indexOf(from) + 1]);
  }
})();
</script>
</body>
</html>
